[package]
name = "hello_old"
version = "0.1.0"
edition = "2021"

[dependencies]
chacha20poly1305 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
libc = "0.2"
argon2 = { version = "0.5", features = ["std"] }
rand = { version = "0.8", features = ["std"] }
getrandom = { version = "0.2", features = ["std"] }
zeroize = "1.7"
subtle = "2.5"
rand_core = "0.10"
hmac = "0.12"
ml-kem = { version = "0.3", default-features = false, features = ["alloc", "getrandom"] }
serpent = "0.6"
cipher = "0.5"
cmac = "0.8"
ed448-goldilocks = "0.14.0-pre.15"
rsa = { version = "0.9", features = ["sha2"] }
classic-mceliece-rust = { version = "3.1", features = ["mceliece6960119f"] }
crystals-dilithium = "2.0"
frodo-kem = { version = "0.1", features = ["frodo1344aes"] }
sm3 = { version = "0.5", features = ["alloc"] }
blake3 = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
chacha20poly1305 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
rand = { version = "0.8", features = ["std"] }
getrandom = { version = "0.2", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
ml-kem = { version = "0.3", default-features = false, features = ["alloc", "getrandom"] }
serpent = "0.6"
cipher = "0.5"
cmac = "0.8"
ed448-goldilocks = "0.14.0-pre.15"
rsa = { version = "0.9", features = ["sha2"] }
classic-mceliece-rust = { version = "3.1", features = ["mceliece6960119f"] }
crystals-dilithium = "2.0"
frodo-kem = { version = "0.1", features = ["frodo1344aes"] }
sm3 = { version = "0.5", features = ["alloc"] }
blake3 = "1.8"
zeroize = "1.7"
hmac = "0.12"
rand_core = "0.10"
subtle = "2.5"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = "symbols"
debug = false



# For nightly CFI, uncomment and use nightly:
# [profile.release]
# rustflags = ["-Z", "sanitizer=cfi", "-Z", "sanitizer=shadow-call-stack", "-C", "force-frame-pointers=yes"]

# Windows support note: This binary targets Linux only (seccomp, ptrace, mmap guard pages, mlock)
# Windows port would require: 
# - Replace seccomp with Windows API restrictions (Job Objects, Mitigation Policies)
# - Replace ptrace with CheckRemoteDebuggerPresent/IsDebuggerPresent
# - Replace mmap/mprotect with VirtualAlloc/VirtualProtect
# - Replace mlock with VirtualLock
# - Replace /proc checks with NtQueryInformationProcess
# Current implementation: Linux-only

# no_std feasibility: NOT FEASIBLE for current implementation because:
# - chacha20poly1305, argon2, rand, getrandom require std
# - libc, mmap, mlock, ptrace, seccomp are Linux syscalls requiring std::os
# - std::thread, std::sync, std::time, std::net (NTP) all need std
# - Panic handling, alloc, collections all need std
# Migration would require: custom allocator, no_std crypto crates, raw syscalls, ~6 months rewrite